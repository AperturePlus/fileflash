services:
  postgres:
    image: postgres:16
    container_name: postgres16
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      # 删掉这一行 ↓（不再用 postgres 自带 init，改由 flyway 管）
      # - ./init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: psgl-ff-db
      POSTGRES_DB: fileflash
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fileflash"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    container_name: flyway
    command: >
      -url=jdbc:postgresql://postgres:5432/fileflash
      -user=admin
      -password=psgl-ff-db
      -connectRetries=10
      migrate
    volumes:
      - ../flyway/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
