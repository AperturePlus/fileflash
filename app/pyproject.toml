[project]
name = "fileflash"
version = "0.1.0"
description = "Self-hosted file workbench: storage, sharing, admin governance, and an LLM agent workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.135.1",
    "fastapi-mail>=1.6.2",
    "minio>=7.2.20",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.11.0",
    "pydantic>=2.12.5",
    "py7zr>=0.21.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.24",
    "anthropic>=0.104.1",
]
[project.scripts]
fileflash = "fileflash.scripts.run_with_workers:main"
fileflash-dev = "fileflash.scripts.run_with_workers:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.151.9",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=5.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI `Depends()`/`Body()` as default args is idiomatic, not a bug
    "E501",  # pre-existing long-line debt; revisit once codebase stabilizes
    "UP042",  # `class X(str, Enum)` is the conventional form for SQLAlchemy/pg enums
    "UP046",  # PEP 695 type-param syntax for Generic classes — style preference, not a bug
    "UP047",  # PEP 695 type-param syntax for generic functions — style preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E731",  # lambdas as throwaway stubs are fine in tests
    "B017",  # `pytest.raises(Exception)` acceptable in tests asserting failure
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fileflash"]
